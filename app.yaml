runtime: python312
entrypoint: gunicorn -b :$PORT --timeout 120 --workers 1 --threads 2 app:app

inbound_services:
  - warmup

instance_class: F1

automatic_scaling:
  min_instances: 0
  max_instances: 2

beta_settings:
  cloud_sql_instances: kumori-404602:us-central1:kumori

env_variables:
  FLASK_ENV: production
  GAE_ENV: standard
  # DB connection = kumori's canonical module (utilities/kumori_db.py, vendored on deploy).
  # IAM login as crab-travel@appspot, runs as crab_app; no DB password read.
  KUMORI_DB_AUTH: iam
  DB_ROLE: crab_app
  DB_SECRET_PREFIX: CRAB
  DB_POOL_MAX: "6"
  DB_SEARCH_PATH: "crab, public"

handlers:
  - url: /static
    static_dir: static
    expiration: "30d"
  - url: /.*
    script: auto
    secure: always
    redirect_http_response_code: 301
